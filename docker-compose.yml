services:
  ##############################################################
  # USERS DATABASE — PostgreSQL
  ##############################################################
  postgres_users:
    image: postgres:16
    container_name: postgres_users
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  ##############################################################
  # MEDIA DATABASE — PostgreSQL
  ##############################################################
  postgres_media:
    image: postgres:16
    container_name: postgres_media
    environment:
      POSTGRES_USER: ${MEDIA_DB_USER}
      POSTGRES_PASSWORD: ${MEDIA_DB_PASSWORD}
      POSTGRES_DB: ${MEDIA_DB_NAME}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_media_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  ##############################################################
  # CHATS DATABASE — PostgreSQL
  ##############################################################
  postgres_chats:
    image: postgres:16
    container_name: postgres_chats
    environment:
      POSTGRES_USER: ${CHATS_DB_USER}
      POSTGRES_PASSWORD: ${CHATS_DB_PASSWORD}
      POSTGRES_DB: ${CHATS_DB_NAME}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_chats_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  ##############################################################
  # NONCE SERVICE — FastAPI
  ##############################################################
  nonce:
    build:
      context: .
      dockerfile: ./services/nonce/Dockerfile
    container_name: nonce_service
    env_file:
      - ./services/nonce/.env
    environment:
      PYTHONPATH: /app
    command: uvicorn nonce.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    volumes:
      - ./services/nonce:/app/nonce
      - ./services/schemas:/app/schemas:ro
    restart: unless-stopped

  ##############################################################
  # MEDIA SERVICE — FastAPI
  ##############################################################
  x-media-env: &media_env
    PYTHONPATH: /app
    DATABASE_URL: ${MEDIA_DATABASE_URL}

  media_1: &media_template
    build:
      context: .
      dockerfile: ./services/media/Dockerfile
    env_file:
      - ./services/media/.env
    environment:
      <<: *media_env
      REPLICA_ID: "media-1"
    command: uvicorn media.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres_media
    volumes:
      - ./services/media:/app/media
      - ./services/schemas:/app/schemas:ro
    restart: unless-stopped

  media_2:
    <<: *media_template
    environment:
      <<: *media_env
      REPLICA_ID: "media-2"

  media_3:
    <<: *media_template
    environment:
      <<: *media_env
      REPLICA_ID: "media-3"

  ##############################################################
  # USERS SERVICE — FastAPI
  ##############################################################
  users:
    build:
      context: .
      dockerfile: ./services/users/Dockerfile
    container_name: users_service
    env_file:
      - ./services/users/.env
    environment:
      PYTHONPATH: /app
      USERS_DATABASE_URL: ${USERS_DATABASE_URL}
      DATABASE_URL: ${USERS_DATABASE_URL}
    command: uvicorn users.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    depends_on:
      - postgres_users
    volumes:
      - ./services/users:/app/users
      - ./services/schemas:/app/schemas:ro
    restart: unless-stopped

  ##############################################################
  # CHATS SERVICE — FastAPI
  ##############################################################
  chats:
    build:
      context: .
      dockerfile: ./services/chats/Dockerfile
    container_name: chats_service
    env_file:
      - ./.env
      - ./services/chats/.env
    environment:
      PYTHONPATH: /app
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHATS_DATABASE_URL: ${CHATS_DATABASE_URL}
      DATABASE_URL: ${CHATS_DATABASE_URL}
    command: uvicorn chats.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8004:8000"
    depends_on:
      - postgres_chats
    volumes:
      - ./services/chats:/app/chats
      - ./services/schemas:/app/schemas:ro
    restart: unless-stopped

  ##############################################################
  # API GATEWAY — FastAPI
  ##############################################################
  gateway:
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    container_name: gateway_service
    environment:
      PYTHONPATH: /app
      MEDIA_BACKENDS: "http://media_1:8000,http://media_2:8000,http://media_3:8000"

      NONCE_URL: "http://nonce:8000"
      USERS_URL: "http://users:8000"
      MEDIA_URL: "http://media:8000"
      CHATS_URL: "http://chats:8000"

    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 # <-- Эту команду оставляем!
    ports:
      - "8005:8000"
    depends_on:
      - nonce
      - users
      - media_1
      - media_2
      - media_3
      - chats
    volumes:
      - ./services/gateway:/app/gateway
      - ./services:/app/services:ro
      - ./services/schemas:/app/schemas:ro
    restart: unless-stopped

  ##############################################################
  # PGADMIN — Database Management Interface
  ##############################################################
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}      # <--- Changed
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD} # <--- Changed
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      - postgres_users
      - postgres_media
      - postgres_chats


volumes:
  postgres_users_data:
  postgres_media_data:
  postgres_chats_data:
  pgadmin_data:

