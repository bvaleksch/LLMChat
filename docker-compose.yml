services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: llm_chat_user
      POSTGRES_PASSWORD: DAVBPMhTIHfEL76q6rpRNk2a4Mzo2Vg1t0oNTeX0xKY
      POSTGRES_DB: llm_chat_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  ##############################################################
  # NONCE SERVICE — FastAPI
  ##############################################################
  nonce:
    build:
      context: .
      dockerfile: ./services/nonce/Dockerfile
    container_name: nonce_service
    env_file:
      - ./services/nonce/.env
    environment:
      PYTHONPATH: /app
    command: uvicorn nonce.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    depends_on:
      - postgres
    volumes:
      - ./services/nonce:/app/nonce
      - ./services/schemas:/app/schemas:ro
    restart: unless-stopped

  ##############################################################
  # MEDIA SERVICE — FastAPI
  ##############################################################
  media:
    build:
      context: .
      dockerfile: ./services/media/Dockerfile
    container_name: media_service
    env_file:
      - ./services/media/.env
    environment:
      PYTHONPATH: /app
    command: uvicorn media.media:router --host 0.0.0.0 --port 8000
    ports:
      - "8003:8000"
    depends_on:
      - postgres
    volumes:
      - ./services/media:/app/users
      - ./services/schemas:/app/schemas:ro
    restart: unless-stopped

  ##############################################################
  # USERS SERVICE — FastAPI
  ##############################################################
  users:
    build:
      context: .
      dockerfile: ./services/users/Dockerfile
    container_name: users_service
    env_file:
      - ./services/users/.env
    environment:
      PYTHONPATH: /app
    command: uvicorn users.users:router --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    depends_on:
      - postgres
    volumes:
      - ./services/users:/app/users
      - ./services/schemas:/app/schemas:ro
    restart: unless-stopped

  ##############################################################
  # CHATS SERVICE — FastAPI
  ##############################################################
  chats:
    build:
      context: .
      dockerfile: ./services/chats/Dockerfile
    container_name: chats_service
    env_file:
      - ./services/chats/.env
    environment:
      PYTHONPATH: /app
    command: uvicorn chats.chats:router --host 0.0.0.0 --port 8000
    ports:
      - "8004:8000"
    depends_on:
      - postgres
    volumes:
      - ./services/chats:/app/chats
      - ./services/schemas:/app/schemas:ro
    restart: unless-stopped

  ##############################################################
  # API GATEWAY — FastAPI
  ##############################################################
  gateway:
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    container_name: gateway_service
    env_file:
      - ./services/gateway/.env
    environment:
      PYTHONPATH: /app

      NONCE_URL: "http://nonce:8000"
      USERS_URL: "http://users:8000"
      MEDIA_URL: "http://media:8000"
      CHATS_URL: "http://chats:8000"

    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 # <-- Эту команду оставляем!
    ports:
      - "8005:8000"
    depends_on:
      - nonce
      - users
      - media
      - chats
    volumes:
      - ./services/gateway:/app/gateway
      - ./services:/app/services:ro
      - ./services/schemas:/app/schemas:ro
    restart: unless-stopped


volumes:
  postgres_data:
